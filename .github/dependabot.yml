version: 2
updates:
  # npm — package.json/package-lock.json dependencies. Pinned browser copies
  # under vendor/ are also submitted to the dependency graph by
  # supply-chain.yml so they receive alerts; their version bumps stay manual.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      types:
        patterns:
          - "@types/*"
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
