name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly catch-up so newly-published rules surface against quiet weeks.
    - cron: "27 5 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}
          # security-extended adds taint-flow + injection rules beyond the
          # default set. Worth it for an app that handles user health data,
          # E2EE crypto (crypto.js / venice-e2ee.js), markdown rendering,
          # and PDF/AI input parsing.
          queries: security-extended
          # Skip external vendored libraries (Chart.js, pdf.js, mammoth, JSZip,
          # cashu-ts, evolu, transformers via CDN, etc.) — findings inside
          # those are upstream, not our code, and produce a flood of noise
          # on first run. Project-owned vendor TypeScript remains scanned.
          # Keep these external paths aligned with vendor/components.json.
          config: |
            paths-ignore:
              - vendor/chart.min.js
              - vendor/pdf.min.mjs
              - vendor/pdf.worker.min.mjs
              - vendor/mammoth.browser.min.js
              - vendor/jszip.min.js
              - vendor/cashu-ts.js
              - vendor/qrcode-generator.js
              - vendor/venice-e2ee.js
              - vendor/venice-nvidia.js
              - vendor/venice-dcap.js
              - vendor/tinfoil-browser.js
              - vendor/ehbp-browser.js
              - vendor/evolu/evolu-bundle.js
              - vendor/evolu/Db.worker.js
              - vendor/evolu8/evolu-bundle.js
              - vendor/evolu8/Db.worker.js
              - vendor/evolu8/Shared.worker.js
              - vendor/evolu8/sqlite3-bundler-friendly.mjs
              - vendor/evolu8/sqlite3-opfs-async-proxy.js
              - vendor/evolu8/sqlite3-worker1-bundler-friendly.mjs
              - vendor/evolu8/sqlite3.wasm
              - vendor/evolu/sqlite3-bundler-friendly.mjs
              - vendor/evolu/sqlite3-opfs-async-proxy.js
              - vendor/evolu/sqlite3-worker1-bundler-friendly.mjs
              - vendor/evolu/sqlite3.wasm
              - vendor/fonts/inter-*.woff2
              - vendor/fonts/outfit-*.woff2
              - vendor/fonts/jetbrains-mono-*.woff2
              - vendor/fonts/vt323-*.woff2
              - vendor/routstr-crypto.js
              - node_modules/**
              - brands/**
              # Test fixtures intentionally exercise unsafe patterns
              # (URL substring matching, hardcoded sensitive-named locals,
              # XSS payloads) to verify the production guards. CodeQL flags
              # those as findings; useful in principle, useless in practice
              # on the browser test suite. Production code is still
              # fully scanned.
              - tests/**

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}
