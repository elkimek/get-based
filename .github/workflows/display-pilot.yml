name: Display pilot acceptance
# The migrated branch uses the same acceptance gates and immutable artifact flow.
on:
  push:
    branches: [codex/tailwind-display-pilot]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: display-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    uses: ./.github/workflows/test.yml
    with:
      full_suite: true
