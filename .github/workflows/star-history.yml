name: Star History

on:
  # Bootstrap immediately when this workflow is first published or revised.
  push:
    branches: [main]
    paths: [.github/workflows/star-history.yml]
  schedule:
    - cron: '17 3 * * *'
  watch:
    types: [started]
  workflow_dispatch:

# Rendering gets read-only access. Only the small, repository-owned commit job
# receives contents:write, so third-party renderer code cannot push changes.
permissions:
  contents: read

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.star-history.outputs.changed }}

    steps:
      - uses: actions/checkout@v7

      # Pinned to v1.0.4. This action vendors Star History's MIT renderer and
      # reads stargazers with the current repository's short-lived token.
      - name: Render light and dark charts
        id: star-history
        uses: narayann7/star-history-action@c2061675dacbf6f35d116e556015b8905843387f
        with:
          repos: ${{ github.repository }}
          output-dir: .github/assets/star-history
          width: 900
          update-readme: false
          commit: false

      - name: Stage generated chart artifact
        if: steps.star-history.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: star-history-chart
          path: .github/assets/star-history
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: render
    if: needs.render.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download generated chart
        uses: actions/download-artifact@v8
        with:
          name: star-history-chart
          path: .github/assets/star-history

      - name: Commit refreshed chart
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/star-history
          if git diff --cached --quiet; then
            echo "Star history is already current."
            exit 0
          fi
          git commit -m "Update star history [skip ci]"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
