# CI test workflow. Runs on every PR + push to main.
#
# PRs run affected tests without repository-wide coverage. Main, manual runs,
# and explicit release verification run the full ./run-tests.sh battery:
#   - Node-side tests (native-dialog guard, lens-local-utils, dev-server
#     origin guard)
#   - Playwright-driven web-app suite
#   - Cold mobile-load resource budgets
#   - Focused Firefox smoke coverage for critical browser flows

name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      full_suite:
        description: 'Run complete regression and coverage for release evidence'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_SCOPE_FULL: ${{ github.event_name != 'pull_request' || inputs.full_suite == true }}
      CI_TEST_PLAN: /tmp/getbased-pr-test-plan.json

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select affected PR tests
        id: scope
        if: env.CI_SCOPE_FULL != 'true'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/pr-test-scope.mjs --base "$PR_BASE_SHA" --output "$CI_TEST_PLAN"

      - name: Run affected unit tests
        if: env.CI_SCOPE_FULL != 'true'
        run: node scripts/pr-test-scope.mjs --run unit --output "$CI_TEST_PLAN"

      - name: Run typecheck
        run: npm run typecheck

      - name: Run full-app checkJs
        run: npm run typecheck:checkjs

      - name: Run server checkJs
        run: npm run typecheck:server

      - name: Run service-worker checkJs
        run: npm run typecheck:service-worker

      - name: Enforce strict-null debt ratchet
        run: npm run typecheck:strict-null

      - name: Verify architecture map and boundaries
        run: npm run architecture:check

      - name: Verify production bundle and performance budgets
        run: npm run production:check

      - name: Run quality guardrails
        run: npm run quality

      - name: Enforce critical behavior branch coverage
        if: env.CI_SCOPE_FULL == 'true'
        run: npm run test:critical-coverage

      - name: Cache Playwright browsers
        if: env.CI_SCOPE_FULL == 'true' || steps.scope.outputs.browser == 'true' || steps.scope.outputs.firefox == 'true' || steps.scope.outputs.pwa == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install full browser engines
        if: env.CI_SCOPE_FULL == 'true' || steps.scope.outputs.pwa == 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install affected Chromium engine
        if: env.CI_SCOPE_FULL != 'true' && steps.scope.outputs.pwa != 'true' && steps.scope.outputs.browser == 'true'
        run: npx playwright install --with-deps chromium

      - name: Install affected Firefox engine
        if: env.CI_SCOPE_FULL != 'true' && steps.scope.outputs.pwa != 'true' && steps.scope.outputs.firefox == 'true'
        run: npx playwright install --with-deps firefox

      - name: Resolve catalog file (fetch from private source if creds set, else use stub)
        env:
          CATALOG_FETCH_URL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CATALOG_FETCH_URL || '' }}
          CATALOG_FETCH_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CATALOG_FETCH_TOKEN || '' }}
        run: node scripts/fetch-catalog.mjs

      - name: Run Firefox smoke suite
        if: env.CI_SCOPE_FULL == 'true'
        run: npm run test:firefox

      - name: Verify PWA offline and update lifecycle across browser engines
        if: env.CI_SCOPE_FULL == 'true'
        run: npm run test:pwa

      - name: Run affected Chromium tests
        if: env.CI_SCOPE_FULL != 'true' && steps.scope.outputs.browser == 'true'
        run: node scripts/pr-test-scope.mjs --run browser --output "$CI_TEST_PLAN"

      - name: Run affected Firefox tests
        if: env.CI_SCOPE_FULL != 'true' && steps.scope.outputs.firefox == 'true'
        run: node scripts/pr-test-scope.mjs --run firefox --output "$CI_TEST_PLAN"

      - name: Run affected PWA tests
        if: env.CI_SCOPE_FULL != 'true' && steps.scope.outputs.pwa == 'true'
        run: node scripts/pr-test-scope.mjs --run pwa --output "$CI_TEST_PLAN"

      - name: Run test suite with coverage ratchet
        if: env.CI_SCOPE_FULL == 'true'
        run: COVERAGE=1 SKIP_TYPECHECK=1 ./run-tests.sh

      - name: Retain complete production coverage
        if: always() && env.CI_SCOPE_FULL == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-coverage
          path: |
            tests/.coverage.json
            tests/.coverage.md
            tests/.coverage.html
            tests/.vitest-coverage/coverage-summary.json
            tests/.critical-coverage/coverage-summary.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Retain affected-test plan
        if: always() && env.CI_SCOPE_FULL != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: affected-test-plan
          path: /tmp/getbased-pr-test-plan.json
          retention-days: 7

      - name: Smoke the deployed production APIs
        if: github.event_name == 'push'
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          PRODUCTION_BASE_URL: https://app.getbased.health
        run: node scripts/production-smoke.mjs

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-logs
          path: |
            /tmp/dev-server.log
            /tmp/getbased-pwa-results
          if-no-files-found: ignore
          retention-days: 7
