name: Sync compatibility

on:
  workflow_dispatch:
    inputs:
      focus:
        type: choice
        default: all
        options: [all, offline, sync]

permissions:
  contents: read

jobs:
  transport:
    if: inputs.focus != 'offline'
    name: Transport (${{ matrix.evolu-client }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        evolu-client: [v8]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out pinned disposable relay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: elkimek/getbased-relay
          ref: 6f237533344308a3032cfb996e3138216d8f454d
          path: .ci/getbased-relay
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .ci/getbased-relay/package-lock.json

      - name: Install app and relay dependencies
        run: |
          npm ci
          npm ci --prefix .ci/getbased-relay
          npm run build --prefix .ci/getbased-relay

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real-relay transport scenario
        shell: bash
        run: |
          set -euo pipefail
          client="${{ matrix.evolu-client }}"
          relay_data_dir="${RUNNER_TEMP}/getbased-relay-${client}"
          relay_log="${RUNNER_TEMP}/getbased-relay-${client}.log"
          mkdir -p "${relay_data_dir}"
          env \
            DATA_DIR="${relay_data_dir}" \
            RELAY_PORT=4000 \
            ADMIN_PORT=4002 \
            SELF_PORT=4003 \
            SELF_BIND=127.0.0.1 \
            SELF_ENABLED=true \
            QUOTA_PER_OWNER_MB=10 \
            QUOTA_GLOBAL_MB=100 \
            LOG_LEVEL=info \
            LOG_FORMAT=text \
            node .ci/getbased-relay/dist/index.js >"${relay_log}" 2>&1 &
          relay_pid=$!
          cleanup_relay() {
            kill "${relay_pid}" 2>/dev/null || true
            wait "${relay_pid}" 2>/dev/null || true
          }
          trap cleanup_relay EXIT

          relay_ready=0
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4002/health >/dev/null; then
              relay_ready=1
              break
            fi
            if ! kill -0 "${relay_pid}" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if [[ "${relay_ready}" != "1" ]]; then
            cat "${relay_log}"
            exit 1
          fi

          env \
            SYNC_TRANSPORT_DEBUG=1 \
            SYNC_TRANSPORT_E2E=1 \
            SYNC_TRANSPORT_EVOLU_CLIENT="${client}" \
            SYNC_TRANSPORT_RELAY=ws://127.0.0.1:4000 \
            SYNC_TRANSPORT_SELF_URL=http://127.0.0.1:4003 \
            npx playwright test tests/playwright/sync-relay-transport-e2e.spec.js --workers=1 --repeat-each=5 --grep "real relay converges"

      - name: Verify affected sync browser behavior
        run: npx playwright test tests/playwright/sync-actions-browser-coverage.spec.js tests/playwright/sync-orchestration-browser-coverage.spec.js tests/playwright/sync-configure-reconcile-browser-coverage.spec.js --workers=1

      - name: Upload transport logs on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sync-transport-${{ matrix.evolu-client }}-logs
          path: |
            ${{ runner.temp }}/getbased-relay-${{ matrix.evolu-client }}.log
            /tmp/getbased-playwright-results
            /tmp/dev-server.log
          if-no-files-found: ignore
          retention-days: 7

  offline:
    if: inputs.focus != 'sync'
    name: Offline baseline (${{ matrix.ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        ref: [codex/diagnose-sync-offline]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci
      - run: npm test -- tests/sync-save-hooks.test.js tests/sync-pull-isolation.test.js
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --config=playwright.pwa.config.js --project=pwa-webkit --grep 'installed shell opens' --repeat-each=5
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: offline-${{ matrix.ref }}
          path: /tmp/getbased-pwa-results
          retention-days: 3
