name: Supply chain

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/supply-chain.yml"
      - "package.json"
      - "package-lock.json"
      - "tooling/**/package.json"
      - "scripts/supply-chain.mts"
      - "scripts/build-typescript.ts"
      - "scripts/native-typescript-ast.ts"
      - "scripts/classic-browser-fixture-entries.json"
      - "tsconfig*.json"
      - "tests/supply-chain.test.ts"
      - "vendor/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/supply-chain.yml"
      - "package.json"
      - "package-lock.json"
      - "tooling/**/package.json"
      - "scripts/supply-chain.mts"
      - "scripts/build-typescript.ts"
      - "scripts/native-typescript-ast.ts"
      - "scripts/classic-browser-fixture-entries.json"
      - "tsconfig*.json"
      - "tests/supply-chain.test.ts"
      - "vendor/**"
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and compile native sources
        run: npm ci

      - name: Validate vendored component inventory
        run: npm run supply-chain:check

      - name: Generate combined CycloneDX SBOM
        run: npm run sbom

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: getbased-cyclonedx-sbom
          path: artifacts/getbased.cdx.json
          if-no-files-found: error
          retention-days: 14

  submit:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and compile native sources
        run: npm ci

      - name: Build vendored dependency snapshot
        run: npm run --silent supply-chain:snapshot > "$RUNNER_TEMP/vendor-dependency-snapshot.json"

      - name: Submit snapshot to GitHub dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api
          --method POST
          -H "X-GitHub-Api-Version: 2026-03-10"
          "repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots"
          --input "$RUNNER_TEMP/vendor-dependency-snapshot.json"
